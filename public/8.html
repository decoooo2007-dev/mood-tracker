<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodFlow — Original UI Color & Motion Studio (8 Themes)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif;

      /* Default Theme 1: Original Cosmic Amethyst */
      --bg-primary: #0F0F14;
      --bg-secondary: #1A1A24;
      --bg-card: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-tertiary: rgba(255, 255, 255, 0.42);
      --border-color: rgba(255, 255, 255, 0.2);

      --accent-from: #a855f7;
      --accent-to: #ec4899;
      --accent-solid: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.22);
      --accent-border: rgba(168, 85, 247, 0.38);
      --accent-text: #d8b4fe;
      --chart-stroke: #A78BFA;
      --chart-dot: #F472B6;

      --bg-gradient-start: #581c87;
      --bg-gradient-mid: #312e81;
      --bg-gradient-end: #1e3a8a;
      --blob-1: rgba(139, 92, 246, 0.42);
      --blob-2: rgba(59, 130, 246, 0.32);
      --blob-3: rgba(236, 72, 153, 0.28);

      --blob-speed: 20s;
      --card-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* Exact MoodFlow Glassmorphism */
    .glass {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: transform 0.35s var(--card-spring),
                  box-shadow 0.35s var(--card-spring),
                  border-color 0.35s ease,
                  background-color 0.35s ease;
    }

    html.light .glass {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px rgba(31, 22, 51, 0.06);
    }

    .glass-modal {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(20, 19, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    html.light .glass-modal {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
    }

    /* Dynamic Accent Utilities matching MoodFlow's gradient buttons & pills */
    .accent-gradient-btn {
      background: linear-gradient(to right, var(--accent-from), var(--accent-to));
      color: #ffffff !important;
      transition: transform 0.25s var(--card-spring), box-shadow 0.25s ease, opacity 0.2s ease;
    }
    .accent-gradient-btn:hover {
      opacity: 0.95;
      box-shadow: 0 10px 25px -5px var(--accent-soft);
    }
    .accent-gradient-btn:active {
      transform: scale(0.98);
    }

    .accent-avatar {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      color: #ffffff !important;
    }

    .accent-pill {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
    }

    .accent-tag-active {
      background: var(--accent-solid) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px var(--accent-soft);
    }

    .nav-active-pill {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      opacity: 0.45;
    }

    /* Exact GlassBackground.tsx Floating Blobs */
    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(100px, 50px) scale(1.06); }
    }
    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-80px, -60px) scale(1.08); }
    }
    @keyframes floatBlob3 {
      0%, 100% { transform: translate(-50px, -30px) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.05); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-22px); opacity: 0.65; }
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.16) rotate(-4deg); }
    }
    @keyframes emojiFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.08); }
    }
    @keyframes shimmerSweep {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .blob-1 {
      background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%);
      animation: floatBlob1 var(--blob-speed) ease-in-out infinite;
      transition: background 0.8s ease;
    }
    .blob-2 {
      background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%);
      animation: floatBlob2 calc(var(--blob-speed) * 1.25) ease-in-out infinite;
      transition: background 0.8s ease;
    }
    .blob-3 {
      background: radial-gradient(circle, var(--blob-3) 0%, transparent 70%);
      animation: floatBlob3 calc(var(--blob-speed) * 0.9) ease-in-out infinite;
      transition: background 0.8s ease;
    }

    /* Motion Preset Variations */
    body[data-motion="elastic"] .glass:hover {
      transform: translateY(-4px) scale(1.008);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.35), 0 0 24px -4px var(--accent-soft);
      border-color: var(--accent-border);
    }
    body[data-motion="elastic"] .mood-btn:hover {
      transform: translateY(-6px) scale(1.06);
    }
    body[data-motion="elastic"] .mood-btn.selected .emoji-icon {
      animation: emojiFloat 2.2s ease-in-out infinite;
    }

    body[data-motion="aurora"] {
      --blob-speed: 10s;
    }
    body[data-motion="aurora"] .glass {
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.3), inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
    }
    body[data-motion="aurora"] .mood-btn.selected {
      box-shadow: 0 0 28px var(--mood-glow, var(--accent-soft));
    }

    body[data-motion="calm"] {
      --blob-speed: 32s;
    }
    body[data-motion="calm"] .glass:hover {
      transform: translateY(-2px);
    }

    .animate-enter {
      animation: cardEntrance 0.45s var(--card-spring) both;
    }
    .flame-animated {
      animation: flamePulse 2.4s ease-in-out infinite;
    }

    /* Range slider exact styling from globals.css */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    /* Light Mode Text Overrides matching globals.css */
    html.light .theme-text-primary { color: #0F172A !important; }
    html.light .theme-text-secondary { color: #334155 !important; }
    html.light .theme-text-muted { color: #64748B !important; }
    html.light .surface-soft { background: rgba(15, 23, 42, 0.05) !important; border-color: rgba(15, 23, 42, 0.1) !important; }

    /* Emoji stack */
    .emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    /* Particle burst animation on save */
    @keyframes burstOut {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 0; }
    }
    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: burstOut 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

      root.style.setProperty("--bg-gradient-start", cfg.bgStart);
      root.style.setProperty("--bg-gradient-mid", cfg.bgMid);
      root.style.setProperty("--bg-gradient-end", cfg.bgEnd);

      // If Mood-Reactive Blobs is ON and a mood is selected, blend blob-1 with the selected mood's aura
      const moodObj = state.selectedMood !== null ? MOODS[state.selectedMood] : null;
      root.style.setProperty("--blob-1", (state.moodReactive && moodObj) ? moodObj.blob : cfg.blob1);
      root.style.setProperty("--blob-2", cfg.blob2);
      root.style.setProperty("--blob-3", cfg.blob3);

      root.style.setProperty("--accent-from", cfg.accentFrom);
      root.style.setProperty("--accent-to", cfg.accentTo);
      root.style.setProperty("--accent-solid", cfg.accentSolid);
      root.style.setProperty("--accent-soft", cfg.accentSoft);
      root.style.setProperty("--accent-border", cfg.accentBorder);
      root.style.setProperty("--accent-text", cfg.accentText);

        if (mod < 8) return "#60A5FA";
        if (mod === 8) return "#A78BFA";
        if (mod === 9) return "#818CF8";

              ${cells.map(c => `<div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-[3px] transition-transform hover:scale-125" style="background: ${c};"></div>`).join("")}

    function renderPage() {

      } else if (state.activeTab === "history") {
        container.innerHTML = renderHistoryPage();
      } else {
        container.innerHTML = renderSettingsPage();
      }

    function selectPalette(id) {
      state.paletteId = id;
      renderPage();

    function setMotion(motionType) {
      state.motion = motionType;
      document.body.setAttribute("data-motion", motionType);
      ["elastic", "aurora", "calm"].forEach(m => {
        const btn = document.getElementById("mot-" + m);
        if (m === motionType) {
          btn.className = "px-2 py-1 rounded-lg font-medium transition-all bg-white/25 text-white";
        } else {
          btn.className = "px-2 py-1 rounded-lg font-medium transition-all text-white/70 hover:text-white";
        }
      });
    }

    function toggleMoodReactive() {
      state.moodReactive = !state.moodReactive;
      const btn = document.getElementById("btn-reactive");
      const isAr = state.locale === "ar";
      if (state.moodReactive) {
        btn.className = "px-2.5 py-1 rounded-xl text-[11px] font-medium bg-emerald-500/25 border border-emerald-400/40 text-emerald-200 transition-all";

      applyPaletteCSS();
    }

    function toggleThemeMode() {
      state.mode = state.mode === "dark" ? "light" : "dark";
      const root = document.documentElement;
      root.classList.toggle("dark", state.mode === "dark");
      root.classList.toggle("light", state.mode === "light");
      document.getElementById("btn-mode").textContent = state.mode === "dark" ? "🌙 Dark" : "☀️ Light";
      renderPage();
    }

    function toggleLocale() {
      state.locale = state.locale === "en" ? "ar" : "en";
      const isAr = state.locale === "ar";
      document.documentElement.dir = isAr ? "rtl" : "ltr";
      document.documentElement.lang = state.locale;
      document.getElementById("btn-lang").textContent = isAr ? "EN" : "عربي";
      document.getElementById("studio-bar-label").textContent = isAr
        ? "نفس تصميم التطبيق الأصلي — اختر الألوان وحركة المؤثرات المفضلة لديك"
        : "Same Original App Base — Pick Your Color Palette & Animation Feel";
      toggleMoodReactive();
      toggleMoodReactive();
      renderPage();

      state.activeTab = tab;
      renderPage();
    }

    function selectMood(idx) {
      state.selectedMood = idx;
      renderPage();
    }

    function updateIntensity(val) {
      state.intensity = parseInt(val, 10) || 50;
      const r = document.getElementById("intensity-readout");
      const f = document.getElementById("intensity-fill");
      if (r) r.textContent = state.intensity + "%";
      if (f) f.style.width = state.intensity + "%";
    }

    function toggleTag(tagEn) {
      if (state.selectedTags.includes(tagEn)) {
        state.selectedTags = state.selectedTags.filter(t => t !== tagEn);
      } else {
        state.selectedTags.push(tagEn);
      }
      renderPage();
    }

    function appendPrompt(text) {
      state.journalText = state.journalText ? state.journalText + "\n" + text + " " : text + " ";
      renderPage();
    }

    function spawnEmojiBurst(x, y, emoji) {
      for (let i = 0; i < 10; i++) {
        const el = document.createElement("div");
        el.className = "burst-particle text-xl emoji";
        el.textContent = emoji;
        const angle = (Math.PI * 2 * i) / 10;
        const dist = 45 + Math.random() * 55;
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        el.style.setProperty("--ty", Math.sin(angle) * dist - 25 + "px");
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
    }

    function saveMoodEntry(e) {
      const m = MOODS[state.selectedMood ?? 0];
      if (e && e.clientX) {
        spawnEmojiBurst(e.clientX, e.clientY, m.emoji);
      }
      state.entries.unshift({
        id: String(Date.now()),
        mood: m.label,
        intensity: state.intensity,
        time: "Just now",
        dateEn: "Today",
        dateAr: "الآن",
        tags: [...state.selectedTags],
        textEn: state.journalText || "Checked in feeling " + m.label.toLowerCase() + ".",
        textAr: state.journalText || "تم تسجيل الحالة المزاجية."
      });
      state.journalText = "";
      const toast = document.getElementById("save-toast");
      document.getElementById("save-toast-text").textContent =
        state.locale === "ar" ? "تم حفظ حالتك المزاجية بنجاح!" : "Mood entry saved!";
      toast.classList.remove("hidden");
      toast.classList.add("flex");
      setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("flex");
      }, 2200);
      renderPage();
    }

    function openBreathingModal() {
      const isAr = state.locale === "ar";
      const modal = document.getElementById("breathing-modal");
      modal.innerHTML = `
        <div class="glass-modal rounded-3xl p-6 max-w-sm w-full text-center text-white border border-white/20 shadow-2xl">
          <div class="flex items-center justify-between mb-4">
            <span class="font-semibold text-sm">🌬️ ${isAr ? "تمرين التنفس ٤-٧-٨" : "4-7-8 Mindful Breathing"}</span>
            <button onclick="closeBreathingModal()" class="p-1.5 rounded-full bg-white/10 hover:bg-white/20 text-xs">✕</button>
          </div>
          <div class="my-8 flex items-center justify-center">
            <div class="w-40 h-40 rounded-full flex flex-col items-center justify-center border-2 border-white/40 shadow-2xl" style="background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%); animation: floatBlob1 6s ease-in-out infinite;">
              <span class="text-3xl font-bold">4</span>
              <span class="text-xs uppercase tracking-widest opacity-80 mt-1">${isAr ? "شهيق هادئ" : "Inhale"}</span>
            </div>
          </div>
          <p class="text-xs text-white/70">${isAr ? "استرخِ ودع التوتر يتلاشى" : "Relax your shoulders and breathe slowly"}</p>
        </div>
      `;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeBreathingModal() {
      const modal = document.getElementById("breathing-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function copySelection() {
      const pal = PALETTES.find(p => p.id === state.paletteId) || PALETTES[0];
      const text = `MoodFlow Theme #${pal.id} (${pal.nameEn}) | Motion: ${state.motion} | Mood-Reactive Blobs: ${state.moodReactive ? "ON" : "OFF"}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      const btn = document.getElementById("btn-copy");
      btn.textContent = state.locale === "ar" ? "تم النسخ ✓" : "Copied ✓";
      setTimeout(() => {
        btn.textContent = state.locale === "ar" ? "نسخ الاختيار" : "Copy Choice";
      }, 1800);
    }

    renderPage();
  </script>
