<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodFlow — 8 Materials, Textures &amp; Component Styles Studio (9.html)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif;

      /* Base Palette (Cosmic Amethyst default, switchable to all 8 palettes) */
      --bg-primary: #0F0F14;
      --bg-secondary: #1A1A24;
      --bg-card: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.68);
      --text-tertiary: rgba(255, 255, 255, 0.44);
      --border-color: rgba(255, 255, 255, 0.2);

      --accent-from: #a855f7;
      --accent-to: #ec4899;
      --accent-solid: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.24);
      --accent-border: rgba(168, 85, 247, 0.42);
      --accent-text: #d8b4fe;
      --chart-stroke: #A78BFA;
      --chart-dot: #F472B6;

      --bg-gradient-start: #581c87;
      --bg-gradient-mid: #312e81;
      --bg-gradient-end: #1e3a8a;
      --blob-1: rgba(139, 92, 246, 0.42);
      --blob-2: rgba(59, 130, 246, 0.32);
      --blob-3: rgba(236, 72, 153, 0.28);

      --card-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* ==================== BASE GLASS CARD ==================== */
    .glass {
      position: relative;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: transform 0.35s var(--card-spring),
                  box-shadow 0.35s var(--card-spring),
                  border-color 0.35s ease,
                  background 0.35s ease;
    }

    /* ==================== 8 PHYSICAL SURFACE MATERIALS ==================== */

    /* MATERIAL 1: Liquid Specular Vision Glass (Apple visionOS Refractive Rim + Cursor Glare) */
    body[data-material="1"] .glass {
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 20%), rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06) 60%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 1.5px 0 0 rgba(255, 255, 255, 0.55),
        inset 1px 0 0 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 0 rgba(255, 255, 255, 0.08),
        0 24px 48px -12px rgba(0, 0, 0, 0.45);
    }
    html.light body[data-material="1"] .glass {
      background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 20%), rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.68) 70%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        inset 0 2px 0 0 #ffffff,
        0 18px 40px -10px rgba(15, 23, 42, 0.12);
    }

    /* MATERIAL 2: Brushed Anodized Titanium & Hardware Keycaps */
    body[data-material="2"] .glass {
      backdrop-filter: none;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px),
        linear-gradient(145deg, rgba(30, 32, 44, 0.96), rgba(17, 18, 26, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
        inset 0 -2px 0 0 rgba(0, 0, 0, 0.65),
        0 16px 32px rgba(0, 0, 0, 0.6);
    }
    html.light body[data-material="2"] .glass {
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
        linear-gradient(145deg, #f8fafc, #e2e8f0);
      border: 1px solid #cbd5e1;
      box-shadow: inset 0 1px 0 #ffffff, 0 12px 24px rgba(15, 23, 42, 0.1);
    }
    body[data-material="2"] .recessed-well {
      background: rgba(8, 9, 14, 0.78) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.75) !important;
    }
    html.light body[data-material="2"] .recessed-well {
      background: #e2e8f0 !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.15) !important;
    }

    /* MATERIAL 3: Soft Velvet Clay (3D Tactile Neumorphism) */
    body[data-material="3"] .glass {
      backdrop-filter: blur(12px);
      background: linear-gradient(145deg, rgba(42, 36, 68, 0.88), rgba(24, 20, 42, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        12px 14px 28px rgba(0, 0, 0, 0.52),
        -6px -6px 18px rgba(255, 255, 255, 0.06),
        inset 2px 2px 5px rgba(255, 255, 255, 0.14),
        inset -3px -3px 7px rgba(0, 0, 0, 0.38);
    }
    html.light body[data-material="3"] .glass {
      background: linear-gradient(145deg, #f5f3ff, #e5e0f8);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        10px 10px 24px rgba(109, 40, 217, 0.12),
        -8px -8px 20px rgba(255, 255, 255, 0.95),
        inset 1px 1px 2px #ffffff;
    }
    body[data-material="3"] .recessed-well {
      box-shadow: inset 4px 4px 9px rgba(0, 0, 0, 0.55), inset -2px -2px 6px rgba(255, 255, 255, 0.06) !important;
      border-color: transparent !important;
    }

    /* MATERIAL 4: Frosted Satin Acrylic + Analog Film Grain + Double Frame */
    body[data-material="4"] .glass {
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      background-color: rgba(255, 255, 255, 0.11);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      outline: 1px solid rgba(255, 255, 255, 0.1);
      outline-offset: -6px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    html.light body[data-material="4"] .glass {
      background-color: rgba(255, 255, 255, 0.82);
      border: 1.5px solid rgba(15, 23, 42, 0.15);
      outline: 1px solid rgba(15, 23, 42, 0.06);
      outline-offset: -6px;
    }

    /* MATERIAL 5: Holographic Iridescent Pearl & Shimmer Foil Rim */
    @keyframes holoShift {
      0%, 100% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(35deg); }
    }
    body[data-material="5"] .glass {
      backdrop-filter: blur(22px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05)) padding-box,
        linear-gradient(135deg, rgba(168,85,247,0.85), rgba(56,189,248,0.85), rgba(244,114,182,0.85), rgba(250,204,21,0.75)) border-box;
      border: 1.5px solid transparent;
      box-shadow:
        0 16px 40px -10px var(--accent-soft),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }
    html.light body[data-material="5"] .glass {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.92), rgba(248,250,252,0.85)) padding-box,
        linear-gradient(135deg, #a855f7, #38bdf8, #ec4899, #eab308) border-box;
      border: 1.5px solid transparent;
    }

    /* MATERIAL 6: Woven Linen Stationery & Stitched Craft Frame */
    body[data-material="6"] .glass {
      backdrop-filter: blur(10px);
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px),
        rgba(28, 25, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      outline: 1px dashed rgba(255, 255, 255, 0.16);
      outline-offset: -7px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
    }
    html.light body[data-material="6"] .glass {
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.018) 0px, rgba(0,0,0,0.018) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.018) 0px, rgba(0,0,0,0.018) 1px, transparent 1px, transparent 4px),
        #faf7f2;
      border: 1px solid #d6d3d1;
      outline: 1px dashed #a8a29e;
      outline-offset: -7px;
    }

    /* MATERIAL 7: Smoked Quartz & Precision Dot-Matrix LED */
    body[data-material="7"] .glass {
      backdrop-filter: blur(18px);
      background:
        radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
        rgba(12, 14, 22, 0.88);
      background-size: 14px 14px, 100% 100%;
      border: 1px solid var(--accent-border);
      box-shadow:
        0 0 24px -6px var(--accent-soft),
        inset 0 0 18px rgba(0, 0, 0, 0.65);
    }
    html.light body[data-material="7"] .glass {
      background:
        radial-gradient(rgba(15, 23, 42, 0.1) 1px, transparent 1px),
        rgba(255, 255, 255, 0.92);
      background-size: 14px 14px, 100% 100%;
      border: 1px solid var(--accent-border);
    }

    /* MATERIAL 8: Glazed Ceramic & Enamel Medallions */
    body[data-material="8"] .glass {
      backdrop-filter: blur(20px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.07) 35%, rgba(255, 255, 255, 0.1) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        inset 0 6px 14px rgba(255, 255, 255, 0.22),
        inset 0 -4px 10px rgba(0, 0, 0, 0.28),
        0 20px 40px -12px rgba(0, 0, 0, 0.42);
    }
    html.light body[data-material="8"] .glass {
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      border: 1.5px solid #ffffff;
      box-shadow:
        inset 0 4px 10px #ffffff,
        inset 0 -3px 8px rgba(15, 23, 42, 0.06),
        0 18px 36px -10px rgba(15, 23, 42, 0.12);
    }

    /* ==================== 4 MOOD BUTTON STYLES ("THE STUFF INSIDE") ==================== */
    /* Style A: Classic Glass Tiles (Default) */
    .mood-style-tiles {
      border-radius: 1rem;
    }

    /* Style B: 3D Tactile Mechanical Keycaps (Depresses on click) */
    .mood-style-keycaps {
      border-radius: 1.1rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)) !important;
      border: 1px solid rgba(255,255,255,0.25) !important;
      box-shadow:
        0 6px 0 0 rgba(0, 0, 0, 0.45),
        0 10px 20px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
      transform: translateY(-2px);
    }
    .mood-style-keycaps:active,
    .mood-style-keycaps.selected {
      transform: translateY(3px) !important;
      box-shadow:
        0 1px 0 0 rgba(0, 0, 0, 0.45),
        0 0 22px var(--mood-glow, var(--accent-soft)),
        inset 0 1px 0 rgba(255, 255, 255, 0.5) !important;
    }

    /* Style C: Floating Glowing Orbs */
    .mood-style-orbs {
      border-radius: 9999px !important;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.28), rgba(255,255,255,0.04) 70%) !important;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.35), 0 10px 24px rgba(0,0,0,0.3);
    }

    /* Style D: Enamel Medallion Capsules */
    .mood-style-enamel {
      border-radius: 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.32) !important;
      box-shadow: inset 0 3px 6px rgba(255,255,255,0.25), inset 0 -3px 6px rgba(0,0,0,0.35);
    }

    /* ==================== ACCENT & ANIMATION UTILITIES ==================== */
    .accent-gradient-btn {
      background: linear-gradient(to right, var(--accent-from), var(--accent-to));
      color: #ffffff !important;
      transition: transform 0.25s var(--card-spring), box-shadow 0.25s ease, opacity 0.2s ease;
    }
    .accent-gradient-btn:hover {
      opacity: 0.96;
      box-shadow: 0 10px 25px -5px var(--accent-soft);
    }
    .accent-avatar {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      color: #ffffff !important;
    }
    .accent-pill {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
    }
    .accent-tag-active {
      background: var(--accent-solid) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px var(--accent-soft);
    }
    .nav-active-pill {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      opacity: 0.45;
    }

    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(100px, 50px) scale(1.06); }
    }
    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-80px, -60px) scale(1.08); }
    }
    @keyframes floatBlob3 {
      0%, 100% { transform: translate(-50px, -30px) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.05); }
    }
    @keyframes auroraWave {
      0%, 100% { transform: translateX(-8%) skewY(-4deg) scaleY(1); }
      50% { transform: translateX(8%) skewY(4deg) scaleY(1.18); }
    }
    @keyframes fireflyFloat {
      0%, 100% { transform: translate(0, 0) scale(0.8); opacity: 0.25; }
      50% { transform: translate(18px, -28px) scale(1.3); opacity: 0.9; }
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.16) rotate(-4deg); }
    }
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(16px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .blob-1 {
      background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%);
      animation: floatBlob1 20s ease-in-out infinite;
    }
    .blob-2 {
      background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%);
      animation: floatBlob2 25s ease-in-out infinite;
    }
    .blob-3 {
      background: radial-gradient(circle, var(--blob-3) 0%, transparent 70%);
      animation: floatBlob3 18s ease-in-out infinite;
    }

    .animate-enter {
      animation: cardEntrance 0.4s var(--card-spring) both;
    }
    .flame-animated {
      animation: flamePulse 2.4s ease-in-out infinite;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    html.light .theme-text-primary { color: #0F172A !important; }
    html.light .theme-text-secondary { color: #334155 !important; }
    html.light .theme-text-muted { color: #64748B !important; }
    html.light .surface-soft { background: rgba(15, 23, 42, 0.05) !important; border-color: rgba(15, 23, 42, 0.1) !important; }

    .emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    @keyframes burstOut {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 0; }
    }
    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: burstOut 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body data-material="1">

  <!-- ==================== TOP MATERIAL & COMPONENT STUDIO BAR ==================== -->
  <div class="sticky top-0 z-50 px-3 pt-2.5 pb-2 bg-black/65 backdrop-blur-xl border-b border-white/15 text-white">
    <div class="max-w-5xl mx-auto flex flex-col gap-2">
      <!-- Row 1: Title + Component Style Switchers ("The Stuff Inside") -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold accent-gradient-btn">9.html Studio</span>
          <span id="studio-title" class="text-xs font-semibold text-white/90">
            8 Surface Materials &amp; Component Styles (8.html Kept Untouched)
          </span>
        </div>

        <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
          <!-- Mood Buttons Shape Switcher -->
          <select onchange="setMoodStyle(this.value)" id="sel-mood-style" class="px-2 py-1 rounded-xl bg-white/10 border border-white/15 text-white outline-none cursor-pointer">
            <option value="tiles" class="bg-slate-900">Buttons: Glass Tiles</option>
            <option value="keycaps" class="bg-slate-900">Buttons: 3D Keycaps</option>
            <option value="orbs" class="bg-slate-900">Buttons: Glowing Orbs</option>
            <option value="enamel" class="bg-slate-900">Buttons: Enamel Badges</option>
          </select>

          <!-- Slider Style Switcher -->
          <select onchange="setSliderStyle(this.value)" id="sel-slider-style" class="px-2 py-1 rounded-xl bg-white/10 border border-white/15 text-white outline-none cursor-pointer">
            <option value="liquid" class="bg-slate-900">Slider: Smooth Liquid</option>
            <option value="led" class="bg-slate-900">Slider: 20-Segment LED</option>
            <option value="pill" class="bg-slate-900">Slider: Thick Capsule</option>
          </select>

          <!-- Background Atmosphere Switcher -->
          <select onchange="setBgStyle(this.value)" id="sel-bg-style" class="px-2 py-1 rounded-xl bg-white/10 border border-white/15 text-white outline-none cursor-pointer">
            <option value="blobs" class="bg-slate-900">BG: Floating Blobs</option>
            <option value="aurora" class="bg-slate-900">BG: Aurora Ribbons</option>
            <option value="fireflies" class="bg-slate-900">BG: Fireflies &amp; Stars</option>
            <option value="matrix" class="bg-slate-900">BG: Precision Dot Grid</option>
          </select>

          <!-- Color Palette Picker (Pair any Material with any Color!) -->
          <select onchange="selectPalette(parseInt(this.value,10))" id="sel-palette" class="px-2 py-1 rounded-xl bg-white/10 border border-white/15 text-white outline-none cursor-pointer">
            <option value="1" class="bg-slate-900">Color: 1. Cosmic Amethyst</option>
            <option value="2" class="bg-slate-900">Color: 2. Northern Aurora</option>
            <option value="3" class="bg-slate-900">Color: 3. Sunset Rose</option>
            <option value="4" class="bg-slate-900">Color: 4. Royal Sapphire</option>
            <option value="5" class="bg-slate-900">Color: 5. Ocean Bioluminescence</option>
            <option value="6" class="bg-slate-900">Color: 6. Botanical Oasis</option>
            <option value="7" class="bg-slate-900">Color: 7. Lavender Silk</option>
            <option value="8" class="bg-slate-900">Color: 8. Obsidian Pearl</option>
          </select>

          <button onclick="toggleThemeMode()" id="btn-mode" class="px-2.5 py-1 rounded-xl font-medium bg-white/10 hover:bg-white/20 border border-white/15 text-white">
            🌙 Dark
          </button>

          <button onclick="toggleLocale()" id="btn-lang" class="px-2.5 py-1 rounded-xl font-semibold bg-white/10 hover:bg-white/20 border border-white/15 text-white">
            عربي
          </button>

          <button onclick="copySelection()" id="btn-copy" class="px-3 py-1 rounded-xl font-bold accent-gradient-btn shadow">
            Copy Choice
          </button>
        </div>
      </div>

      <!-- Row 2: 8 Surface Material Presets -->
      <div id="material-bar" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-1.5"></div>
    </div>
  </div>

  <!-- ==================== MOODFLOW APP ROOT ==================== -->
  <div class="min-h-screen relative overflow-hidden" id="moodflow-root">
    <!-- Dynamic Background Layer -->
    <div id="bg-layer" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Main Content Container (Exact MoodFlow Base Layout) -->
    <div id="page-container" class="relative z-10 max-w-4xl mx-auto px-4 py-8 md:px-6 md:py-10 pb-32"></div>

    <!-- Save Toast -->
    <div id="save-toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden px-6 py-3 backdrop-blur-xl bg-emerald-500/95 text-white rounded-full border border-white/20 shadow-2xl items-center gap-2">
      <span>✨</span>
      <span id="save-toast-text" class="font-medium text-sm">Mood entry saved!</span>
    </div>

    <!-- Exact Floating Bottom Pill Navigation -->
    <nav class="fixed bottom-5 left-0 right-0 z-40 flex justify-center pointer-events-none px-2">
      <div class="pointer-events-auto max-w-[calc(100vw-1.5rem)]">
        <div class="glass rounded-full px-2.5 py-1.5 flex items-center gap-1 shadow-2xl">
          <div class="flex items-center" id="bottom-nav-items"></div>
          <div class="w-px h-6 bg-white/20 mx-1"></div>
          <button onclick="toggleLocale()" class="flex items-center gap-1 px-2.5 py-1.5 hover:bg-white/10 rounded-full transition-colors theme-text-primary text-xs font-semibold">

          <div class="blob-2 absolute w-[600px] h-[600px] rounded-full" style="bottom: -10%; right: -5%;"></div>
          <div class="blob-3 absolute w-[500px] h-[500px] rounded-full" style="top: 45%; left: 45%;"></div>

      } else if (state.bgStyle === "aurora") {
        bg.innerHTML = `

        `;
      } else if (state.bgStyle === "fireflies") {
        const dots = Array.from({ length: 18 }, (_, i) => {
          const top = (i * 19 + 7) % 92;
          const left = (i * 29 + 11) % 94;
          const size = 4 + (i % 4) * 3;
          const dur = 3.5 + (i % 5);
          return `<div class="absolute rounded-full" style="top:${top}%; left:${left}%; width:${size}px; height:${size}px; background: radial-gradient(circle, #fff, var(--accent-from)); box-shadow: 0 0 12px var(--accent-from); animation: fireflyFloat ${dur}s ease-in-out infinite ${i * 0.2}s;"></div>`;

        bg.innerHTML = `${baseGrad}<div class="blob-1 absolute w-[650px] h-[650px] rounded-full" style="top:-15%; left:-10%;"></div>${dots}`;

        bg.innerHTML = `
          ${baseGrad}

        <div class="mb-5 px-1">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs theme-text-secondary font-medium">${isAr ? "شدة الشعور" : "Mood Intensity"}</span>
            <span id="intensity-readout" class="text-xs theme-text-primary font-bold">${state.intensity}%</span>
          </div>
          <div class="relative h-2.5 rounded-full bg-white/10 surface-soft recessed-well overflow-hidden">
            <div
              id="intensity-fill"
              class="absolute inset-y-0 start-0 rounded-full transition-all duration-150"
              style="width: ${state.intensity}%; background: linear-gradient(to right, var(--accent-from), var(--accent-to));"
            ></div>
            <input
              type="range"
              min="1"
              max="100"
              value="${state.intensity}"
              oninput="updateIntensity(this.value, false)"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            />
          </div>
        </div>
      `;
    }

    function renderTodayPage() {
      const isAr = state.locale === "ar";
      const mat = MATERIALS.find(m => m.id === state.materialId) || MATERIALS[0];
      const moodBtnClass =
        state.moodStyle === "keycaps" ? "mood-style-keycaps" :
        state.moodStyle === "orbs" ? "mood-style-orbs" :
        state.moodStyle === "enamel" ? "mood-style-enamel" : "mood-style-tiles";

      return `
        <!-- Active Material Info Pill -->
        <div class="flex items-center justify-center mb-4 animate-enter">
          <div class="glass rounded-full px-4 py-1.5 flex items-center gap-2 text-xs shadow-sm">
            <span>${mat.icon}</span>
            <span class="theme-text-primary font-bold">${isAr ? mat.nameAr : mat.nameEn}</span>
            <span class="theme-text-muted">·</span>
            <span class="theme-text-secondary">${isAr ? mat.descAr : mat.descEn}</span>
          </div>
        </div>

        <!-- 1. Hero User Banner -->
        <div class="glass rounded-full px-4 py-2.5 mb-6 shadow-lg animate-enter">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full accent-avatar flex items-center justify-center shadow-md font-bold text-base">
                A
              </div>
              <div>
                <p class="theme-text-secondary text-xs">${isAr ? "مرحباً بعودتك" : "Welcome back"}</p>
                <p class="theme-text-primary font-semibold text-sm">@abdelrhman</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1.5 px-3 py-1.5 accent-pill rounded-full text-xs font-medium">
                <span>🌬️</span>
                <span>${isAr ? "تنفس هادئ" : "Calm Breath"}</span>
              </div>

              <div class="flex items-center gap-1.5 px-3 py-1.5 bg-white/10 surface-soft recessed-well rounded-full">
                <span class="flame-animated inline-block">🔥</span>
                <div class="flex items-baseline gap-1">
                  <span class="theme-text-primary font-bold text-sm">7</span>
                  <span class="theme-text-secondary text-[10px]">${isAr ? "أيام متتالية" : "day streak"}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 2. Header Greeting -->
        <div class="text-center mb-8 animate-enter" style="animation-delay: 0.04s;">
          <div class="inline-flex items-center gap-2 px-4 py-1.5 glass rounded-full mb-3">
            <span>✨</span>
            <span class="text-xs theme-text-secondary font-medium">
              ${isAr ? "تتبع مستمر منذ ٧ أيام" : "You're on a streak!"}
            </span>
            <span class="flame-animated">🔥</span>
          </div>
          <h1 class="text-3xl md:text-4xl font-bold theme-text-primary mb-2">
            ${isAr ? "كيف تشعر الآن؟" : "How are you feeling?"}
          </h1>
          <p class="theme-text-secondary text-sm">
            ${isAr ? "خذ لحظة هادئة للتواصل مع مشاعرك" : "Take a moment to check in with yourself"}
          </p>
        </div>

        <!-- 3. Mood Selector Card -->
        <div class="glass rounded-[2rem] p-5 md:p-6 mb-6 shadow-xl animate-enter" style="animation-delay: 0.08s;">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-semibold theme-text-primary flex items-center gap-2">
              <span>💗</span>
              <span>${isAr ? "اختر حالتك المزاجية" : "Select your mood"}</span>
            </h2>
            <div class="inline-flex rounded-full bg-white/10 surface-soft recessed-well p-0.5 text-[11px]">
              <span class="px-2.5 py-0.5 rounded-full accent-gradient-btn font-semibold">${isAr ? "اليوم" : "Today"}</span>
              <span class="px-2.5 py-0.5 rounded-full theme-text-secondary cursor-pointer">${isAr ? "أمس" : "Yesterday"}</span>
            </div>
          </div>

          <!-- 5 Mood Buttons with Switchable Physical Material Style -->
          <div class="grid grid-cols-5 gap-2.5 md:gap-3.5 mb-5">
            ${MOODS.map((m, idx) => {
              const isSelected = state.selectedMood === idx;
              return `
                <button
                  onclick="selectMood(${idx})"
                  class="mood-btn ${moodBtnClass} ${isSelected ? "selected" : ""} relative flex flex-col items-center justify-center p-2.5 md:p-4 transition-all min-h-[76px] md:min-h-[90px] ${
                    isSelected
                      ? "ring-2 ring-white scale-105 bg-white/20 border border-white/40"
                      : "bg-white/5 surface-soft hover:bg-white/10 border border-white/10"
                  }"
                  style="${isSelected ? `box-shadow: 0 10px 28px -6px ${m.blob};` : ""}"
                >
                  <span class="text-2xl md:text-3xl emoji">${m.emoji}</span>
                  <span class="text-[11px] md:text-xs mt-1.5 font-medium theme-text-primary ${isSelected ? "font-bold" : "opacity-75"}">
                    ${isAr ? m.ar : m.label}
                  </span>
                </button>
              `;
            }).join("")}
          </div>

          <!-- Dynamic Intensity Slider (Liquid / 20-Segment LED / Thick Capsule) -->
          ${renderIntensitySlider()}

          <!-- Activity Tags + Journal Well -->
          <div class="pt-4 border-t border-white/10">
            <span class="text-xs theme-text-secondary mb-2 block">${isAr ? "الأنشطة والعوامل المؤثرة" : "What have you been up to?"}</span>
            <div class="flex flex-wrap items-center gap-1.5 mb-4">
              ${TAGS.map(tag => {
                const active = state.selectedTags.includes(tag.en);
                return `
                  <button
                    onclick="toggleTag('${tag.en}')"
                    class="px-3 py-1 rounded-full text-xs font-medium transition-all ${
                      active
                        ? "accent-tag-active"
                        : "bg-white/10 surface-soft recessed-well theme-text-secondary hover:bg-white/20"
                    }"
                  >
                    ${isAr ? tag.ar : tag.en}
                  </button>
                `;
              }).join("")}
            </div>

            <textarea
              oninput="state.journalText = this.value"
              placeholder="${isAr ? "اكتب أفكارك ومشاعرك بحرية... (مشفر بالكامل)" : "Write your thoughts freely... (End-to-End Encrypted)"}"
              class="w-full h-24 p-3.5 bg-white/10 surface-soft recessed-well rounded-2xl border border-white/20 outline-none resize-none transition-all theme-text-primary text-sm"
            >${state.journalText}</textarea>

            <button
              onclick="saveMoodEntry(event)"
              class="mt-3.5 w-full py-3 rounded-xl font-semibold flex items-center justify-center gap-2 accent-gradient-btn shadow-lg"
            >
              <span>＋</span>
              <span>${isAr ? "حفظ الحالة المزاجية" : "Save Mood Entry"}</span>
            </button>
          </div>
        </div>

        <!-- 4. Weekly AI Reflection Card -->
        <div class="glass rounded-2xl p-4 md:p-5 mb-6 shadow-md animate-enter" style="animation-delay: 0.12s;">
          <div class="flex items-center justify-between mb-2.5">
            <div class="flex items-center gap-2">
              <span>✨</span>
              <span class="text-xs font-semibold theme-text-primary">
                ${isAr ? "تأملات الذكاء الاصطناعي الأسبوعية" : "Weekly AI Reflection"}
              </span>
            </div>
            <span class="px-2.5 py-1 rounded-xl text-[11px] font-medium accent-pill">
              ${isAr ? "تحليل ذكي" : "AI Active"}
            </span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 mt-2">
            <div class="p-3 bg-white/5 surface-soft recessed-well rounded-xl border border-white/10">
              <p class="text-[11px] font-semibold mb-1" style="color: var(--accent-text);">${isAr ? "النمط الأسبوعي" : "Weekly Pattern"}</p>
              <p class="text-xs theme-text-secondary">${isAr ? "يرتفع صفاء ذهنك بنسبة ٢٦٪ في الفترات الصباحية." : "Your mood clarity rises by 26% during morning check-ins."}</p>
            </div>
            <div class="p-3 bg-white/5 surface-soft recessed-well rounded-xl border border-white/10">
              <p class="text-[11px] font-semibold text-pink-300 mb-1">${isAr ? "أقوى داعم إيجابي" : "Top Mood Booster"}</p>
              <p class="text-xs theme-text-secondary">${isAr ? "الرياضة والصلاة كانتا الأكثر ارتباطاً بالسعادة." : "Exercise and prayer were your strongest positive drivers."}</p>
            </div>
            <div class="p-3 bg-white/5 surface-soft recessed-well rounded-xl border border-white/10">
              <p class="text-[11px] font-semibold text-emerald-300 mb-1">${isAr ? "عادة مقترحة" : "Suggested Habit"}</p>
              <p class="text-xs theme-text-secondary">${isAr ? "خصص ٥ دقائق للتنفس الهادئ قبل النوم." : "Take 5 minutes of calm breathing before bed."}</p>
            </div>
          </div>
        </div>

        <!-- 5. Stats Grid -->
        <div class="grid grid-cols-3 gap-3 md:gap-4 mb-6 animate-enter" style="animation-delay: 0.16s;">
          <div class="glass rounded-2xl p-4 text-center shadow-md">
            <div class="flex items-center justify-center gap-1.5 mb-1">
              <span>📖</span>
              <span class="text-2xl font-bold theme-text-primary">27</span>
            </div>
            <p class="text-xs theme-text-muted">${isAr ? "إجمالي التدوينات" : "Total Entries"}</p>
          </div>
          <div class="glass rounded-2xl p-4 text-center shadow-md">
            <div class="flex items-center justify-center gap-1.5 mb-1">
              <span class="flame-animated">🔥</span>
              <span class="text-2xl font-bold theme-text-primary">7</span>
            </div>
            <p class="text-xs theme-text-muted">${isAr ? "السلسلة الحالية" : "Day Streak"}</p>
          </div>
          <div class="glass rounded-2xl p-4 text-center shadow-md">
            <div class="flex items-center justify-center gap-1.5 mb-1">
              <span>📅</span>
              <span class="text-2xl font-bold theme-text-primary">5</span>
            </div>
            <p class="text-xs theme-text-muted">${isAr ? "هذا الأسبوع" : "This Week"}</p>
          </div>
        </div>

        <!-- 6. Weekly Trend Area Chart -->
        <div class="glass rounded-3xl p-6 mb-6 shadow-xl animate-enter" style="animation-delay: 0.2s;">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-semibold theme-text-primary flex items-center gap-2">
              <span>📈</span>
              <span>${isAr ? "اتجاه المزاج الأسبوعي" : "Weekly Mood Trend"}</span>
            </h2>
            <span class="text-xs theme-text-muted">${isAr ? "آخر ٧ أيام" : "Last 7 days"}</span>
          </div>
          <div class="w-full h-36">
            <svg viewBox="0 0 600 130" class="w-full h-full overflow-visible">
              <defs>
                <linearGradient id="areaGrad9" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--chart-stroke)" stop-opacity="0.45" />
                  <stop offset="100%" stop-color="var(--chart-stroke)" stop-opacity="0.0" />
                </linearGradient>
              </defs>
              <path d="M 20,75 C 90,65 130,35 190,40 C 250,45 290,80 350,55 C 410,30 460,25 510,30 C 550,34 570,22 585,18 L 585,105 L 20,105 Z" fill="url(#areaGrad9)" />
              <path d="M 20,75 C 90,65 130,35 190,40 C 250,45 290,80 350,55 C 410,30 460,25 510,30 C 550,34 570,22 585,18" fill="none" stroke="var(--chart-stroke)" stroke-width="3" stroke-linecap="round" />
              ${[
                { x: 20, y: 75, dEn: "Sat", dAr: "السبت" },
                { x: 115, y: 52, dEn: "Sun", dAr: "الأحد" },
                { x: 210, y: 42, dEn: "Mon", dAr: "الإثنين" },
                { x: 305, y: 65, dEn: "Tue", dAr: "الثلاثاء" },
                { x: 400, y: 38, dEn: "Wed", dAr: "الأربعاء" },
                { x: 495, y: 28, dEn: "Thu", dAr: "الخميس" },
                { x: 585, y: 18, dEn: "Fri", dAr: "الجمعة" }
              ].map((pt, i) => `
                <circle cx="${pt.x}" cy="${pt.y}" r="${i === 6 ? 5.5 : 4}" fill="${i === 6 ? "var(--chart-dot)" : "var(--chart-stroke)"}" />
                <text x="${pt.x}" y="124" text-anchor="middle" fill="currentColor" class="text-[11px] opacity-65">${isAr ? pt.dAr : pt.dEn}</text>
              `).join("")}
            </svg>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const isAr = state.locale === "ar";
      const items = [
        { id: "home", label: isAr ? "الرئيسية" : "Home", icon: "🏠" },
        { id: "history", label: isAr ? "السجل" : "History", icon: "🕒" },
        { id: "settings", label: isAr ? "الإعدادات" : "Settings", icon: "⚙️" }
      ];
      document.getElementById("bottom-nav-items").innerHTML = items.map(item => {
        const isActive = state.activeTab === item.id;
        return `
          <button
            onclick="state.activeTab='${item.id}'; renderAll();"
            class="relative flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-full transition-all min-w-[68px]"
          >
            ${isActive ? `<div class="absolute inset-0 nav-active-pill rounded-full"></div>` : ""}
            <span class="text-sm relative z-10">${item.icon}</span>
            <span class="text-[10px] relative z-10 theme-text-primary ${isActive ? "font-bold" : "opacity-65"}">${item.label}</span>
          </button>
        `;
      }).join("");
      document.getElementById("nav-lang-label").textContent = isAr ? "EN" : "عربي";
    }

    function selectMaterial(id) {
      state.materialId = id;
      const mat = MATERIALS.find(m => m.id === id);
      if (mat) {
        state.moodStyle = mat.recMoodStyle;
        state.sliderStyle = mat.recSliderStyle;
        state.bgStyle = mat.recBgStyle;
        document.getElementById("sel-mood-style").value = state.moodStyle;
        document.getElementById("sel-slider-style").value = state.sliderStyle;
        document.getElementById("sel-bg-style").value = state.bgStyle;
      }
      renderAll();
    }

    function selectPalette(id) {
      state.paletteId = id;
      renderAll();
    }

    function setMoodStyle(val) {
      state.moodStyle = val;
      renderAll();
    }

    function setSliderStyle(val) {
      state.sliderStyle = val;
      renderAll();
    }

    function setBgStyle(val) {
      state.bgStyle = val;
      renderAll();
    }

    function selectMood(idx) {
      state.selectedMood = idx;
      renderAll();
    }

    function updateIntensity(val, fullRender) {
      state.intensity = parseInt(val, 10) || 50;
      const r = document.getElementById("intensity-readout");
      const f = document.getElementById("intensity-fill");
      if (r) r.textContent = state.intensity + "%";
      if (f) f.style.width = state.intensity + "%";
      if (state.sliderStyle === "led" || fullRender) {
        renderAll();
      }
    }

    function toggleTag(tagEn) {
      if (state.selectedTags.includes(tagEn)) {
        state.selectedTags = state.selectedTags.filter(t => t !== tagEn);
      } else {
        state.selectedTags.push(tagEn);
      }
      renderAll();
    }

    function toggleThemeMode() {
      state.mode = state.mode === "dark" ? "light" : "dark";
      document.documentElement.classList.toggle("dark", state.mode === "dark");
      document.documentElement.classList.toggle("light", state.mode === "light");
      document.getElementById("btn-mode").textContent = state.mode === "dark" ? "🌙 Dark" : "☀️ Light";
      renderAll();
    }

    function toggleLocale() {
      state.locale = state.locale === "en" ? "ar" : "en";
      const isAr = state.locale === "ar";
      document.documentElement.dir = isAr ? "rtl" : "ltr";
      document.documentElement.lang = state.locale;
      document.getElementById("btn-lang").textContent = isAr ? "EN" : "عربي";
      document.getElementById("studio-title").textContent = isAr
        ? "٨ خامات وتفاصيل تفاعلية مختلفة على نفس تصميم التطبيق الأصلي"
        : "8 Surface Materials & Component Styles (8.html Kept Untouched)";
      renderAll();
    }

    function saveMoodEntry(e) {
      const m = MOODS[state.selectedMood ?? 0];
      if (e && e.clientX) {
        for (let i = 0; i < 8; i++) {
          const el = document.createElement("div");
          el.className = "burst-particle text-xl emoji";
          el.textContent = m.emoji;
          const angle = (Math.PI * 2 * i) / 8;
          const dist = 45 + Math.random() * 45;
          el.style.left = e.clientX + "px";
          el.style.top = e.clientY + "px";
          el.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--ty", Math.sin(angle) * dist - 20 + "px");
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 850);
        }
      }
      const toast = document.getElementById("save-toast");
      toast.classList.remove("hidden");
      toast.classList.add("flex");
      setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("flex");
      }, 2000);
    }

    function copySelection() {
      const mat = MATERIALS.find(m => m.id === state.materialId) || MATERIALS[0];
      const pal = PALETTES.find(p => p.id === state.paletteId) || PALETTES[0];
      const text = `Material #${mat.id} (${mat.nameEn}) | Buttons: ${state.moodStyle} | Slider: ${state.sliderStyle} | BG: ${state.bgStyle} | Color: #${pal.id} (${pal.nameEn})`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      const btn = document.getElementById("btn-copy");
      btn.textContent = state.locale === "ar" ? "تم النسخ ✓" : "Copied ✓";
      setTimeout(() => {
        btn.textContent = state.locale === "ar" ? "نسخ الاختيار" : "Copy Choice";
      }, 1800);
    }

    function renderAll() {
      applyCSSVariables();
      renderBackgroundLayer();
      renderMaterialBar();
      renderBottomNav();
      document.getElementById("page-container").innerHTML = renderTodayPage();
    }

    renderAll();
  </script>
</body>
</html>
