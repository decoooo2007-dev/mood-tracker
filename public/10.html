<!DOCTYPE html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodFlow — 10.html Reference Studio (Vision Crystal, Multi-Hue Light/Dark &amp; RTL Chart)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif;

      /* Palette Variables (populated dynamically by JS for coherent Dark & Light) */
      --bg-primary: #0B0B12;
      --bg-card-base: rgba(255, 255, 255, 0.065);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.72);
      --text-tertiary: rgba(255, 255, 255, 0.48);
      --border-color: rgba(255, 255, 255, 0.22);

      --accent-from: #a855f7;
      --accent-via: #ec4899;
      --accent-to: #38bdf8;
      --accent-solid: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.22);
      --accent-border: rgba(168, 85, 247, 0.44);
      --accent-text: #e9d5ff;

      --chart-stroke: #C084FC;
      --chart-dot: #38BDF8;

      --bg-gradient-start: #3b0764;
      --bg-gradient-mid: #1e1b4b;
      --bg-gradient-end: #0f172a;
      --blob-1: rgba(168, 85, 247, 0.42);
      --blob-2: rgba(236, 72, 153, 0.30);
      --blob-3: rgba(56, 189, 248, 0.28);

      --spotlight-color: rgba(255, 255, 255, 0.20);
      --spotlight-size: 520px;
      --card-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.48);
      --rim-top: rgba(255, 255, 255, 0.55);
      --rim-left: rgba(255, 255, 255, 0.25);

      --well-bg: rgba(8, 10, 18, 0.42);
      --well-border: rgba(255, 255, 255, 0.14);

      --card-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --mouse-x: 50%;
      --mouse-y: 25%;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* ==================== VISION CRYSTAL SURFACE WITH CURSOR SPOTLIGHT ==================== */
    .glass {
      position: relative;
      backdrop-filter: blur(28px) saturate(185%);
      -webkit-backdrop-filter: blur(28px) saturate(185%);
      background:
        radial-gradient(
          var(--spotlight-size) circle at var(--mouse-x, 50%) var(--mouse-y, 25%),
          var(--spotlight-color),
          var(--bg-card-base) 62%
        );
      border: 1px solid var(--border-color);
      box-shadow:
        inset 0 1.5px 0 0 var(--rim-top),
        inset 1px 0 0 0 var(--rim-left),
        inset 0 -1px 0 0 rgba(255, 255, 255, 0.08),
        var(--card-shadow);
      transition: transform 0.32s var(--card-spring),
                  box-shadow 0.32s var(--card-spring),
                  border-color 0.3s ease;
    }

    /* Spotlight Preset Variations */
    body[data-spot="prism"] .glass {
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
    }

    body[data-spot="velvet"] .glass {
      box-shadow:
        inset 0 2px 0 0 rgba(255, 255, 255, 0.68),
        inset 1px 0 0 0 rgba(255, 255, 255, 0.35),
        inset 0 -12px 24px -8px rgba(0, 0, 0, 0.25),
        var(--card-shadow);
    }

    body[data-spot="halo"] {
      --spotlight-size: 740px;
    }

    /* Light Mode Coherent Pearl Glass */
    html.light .glass {
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      background:
        radial-gradient(
          var(--spotlight-size) circle at var(--mouse-x, 50%) var(--mouse-y, 25%),
          var(--spotlight-color),
          var(--bg-card-base) 65%
        );
      border: 1px solid var(--border-color);
      box-shadow:
        inset 0 2px 0 0 rgba(255, 255, 255, 0.95),
        inset 1px 0 0 0 rgba(255, 255, 255, 0.72),
        var(--card-shadow);
    }

    .glass-modal {
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      background: rgba(16, 17, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    html.light .glass-modal {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(15, 23, 42, 0.14);
      box-shadow: 0 24px 55px rgba(15, 23, 42, 0.18);
      color: #0F172A;
    }

    /* Recessed Wells (Capsule track, journal textarea, streak badge) */
    .recessed-well {
      background: var(--well-bg);
      border: 1px solid var(--well-border);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.28);
    }
    html.light .recessed-well {
      background: var(--well-bg);
      border: 1px solid var(--well-border);
      box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.08);
    }

    /* ==================== 3 USER-FAVORITE MOOD BUTTON STYLES ==================== */

    /* 1. 3D Keycaps (Default) */
    .mood-btn-keycaps {
      border-radius: 1.15rem;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.26);
      box-shadow:
        0 6px 0 0 rgba(0, 0, 0, 0.42),
        0 12px 22px rgba(0, 0, 0, 0.34),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.48);
      transform: translateY(-2px);
      transition: transform 0.2s var(--card-spring), box-shadow 0.2s ease, background 0.25s ease;
    }
    .mood-btn-keycaps:hover {
      transform: translateY(-4px);
    }
    .mood-btn-keycaps:active,
    .mood-btn-keycaps.selected {
      transform: translateY(3px) !important;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.12));
      box-shadow:
        0 1px 0 0 rgba(0, 0, 0, 0.45),
        0 0 26px var(--mood-glow, var(--accent-soft)),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.6);
    }
    html.light .mood-btn-keycaps {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(241, 245, 249, 0.85));
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow:
        0 5px 0 0 rgba(100, 116, 139, 0.28),
        0 10px 18px rgba(15, 23, 42, 0.08),
        inset 0 2px 0 #ffffff;
    }
    html.light .mood-btn-keycaps:active,
    html.light .mood-btn-keycaps.selected {
      background: linear-gradient(180deg, #ffffff, rgba(255, 255, 255, 0.92));
      border-color: var(--mood-color, var(--accent-solid));
      box-shadow:
        0 1px 0 0 rgba(100, 116, 139, 0.3),
        0 0 24px var(--mood-glow, var(--accent-soft)),
        inset 0 2px 0 #ffffff;
    }

    /* 2. Glowing Orbs */
    .mood-btn-orbs {
      border-radius: 9999px !important;
      aspect-ratio: 1 / 1;
      max-width: 96px;
      margin: 0 auto;
      width: 100%;
      background: radial-gradient(circle at 30% 26%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.05) 72%);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        inset 0 2px 8px rgba(255, 255, 255, 0.4),
        0 10px 24px rgba(0, 0, 0, 0.32);
      transition: transform 0.25s var(--card-spring), box-shadow 0.25s ease;
    }
    .mood-btn-orbs:hover {
      transform: translateY(-4px) scale(1.04);
    }
    .mood-btn-orbs.selected {
      transform: scale(1.08);
      border-color: rgba(255, 255, 255, 0.85);
      background: radial-gradient(circle at 30% 26%, rgba(255, 255, 255, 0.5), var(--mood-glow, var(--accent-soft)) 78%);
      box-shadow:
        inset 0 2px 10px rgba(255, 255, 255, 0.65),
        0 0 32px var(--mood-glow, var(--accent-soft));
    }
    html.light .mood-btn-orbs {
      background: radial-gradient(circle at 30% 26%, #ffffff, rgba(226, 232, 240, 0.78) 76%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        inset 0 3px 6px #ffffff,
        0 10px 22px rgba(15, 23, 42, 0.1);
    }
    html.light .mood-btn-orbs.selected {
      background: radial-gradient(circle at 30% 26%, #ffffff, var(--mood-glow, var(--accent-soft)) 82%);
      border-color: var(--mood-color, var(--accent-solid));
      box-shadow:
        inset 0 3px 8px #ffffff,
        0 0 26px var(--mood-glow, var(--accent-soft));
    }

    /* 3. Hybrid 3D Orb-Keycaps (Physical Press Bevel + Radial Orb Glow) */
    .mood-btn-hybrid {
      border-radius: 1.65rem;
      background: radial-gradient(circle at 35% 22%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.05) 75%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow:
        0 6px 0 0 rgba(0, 0, 0, 0.38),
        0 12px 24px rgba(0, 0, 0, 0.3),
        inset 0 2px 6px rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
      transition: transform 0.22s var(--card-spring), box-shadow 0.22s ease;
    }
    .mood-btn-hybrid:active,
    .mood-btn-hybrid.selected {
      transform: translateY(3px) scale(1.03) !important;
      background: radial-gradient(circle at 35% 22%, rgba(255, 255, 255, 0.42), var(--mood-glow, var(--accent-soft)) 82%);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow:
        0 1px 0 0 rgba(0, 0, 0, 0.4),
        0 0 30px var(--mood-glow, var(--accent-soft)),
        inset 0 2px 8px rgba(255, 255, 255, 0.65);
    }
    html.light .mood-btn-hybrid {
      background: radial-gradient(circle at 35% 22%, #ffffff, rgba(241, 245, 249, 0.88) 78%);
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow:
        0 5px 0 0 rgba(100, 116, 139, 0.25),
        0 10px 20px rgba(15, 23, 42, 0.08),
        inset 0 2px 5px #ffffff;
    }
    html.light .mood-btn-hybrid:active,
    html.light .mood-btn-hybrid.selected {
      background: radial-gradient(circle at 35% 22%, #ffffff, var(--mood-glow, var(--accent-soft)) 84%);
      border-color: var(--mood-color, var(--accent-solid));
      box-shadow:
        0 1px 0 0 rgba(100, 116, 139, 0.28),
        0 0 24px var(--mood-glow, var(--accent-soft)),
        inset 0 2px 6px #ffffff;
    }

    /* ==================== 3-STOP WIDE-SPECTRUM ACCENTS ==================== */
    .accent-gradient-btn {
      background: linear-gradient(110deg, var(--accent-from), var(--accent-via), var(--accent-to));
      color: #ffffff !important;
      transition: transform 0.25s var(--card-spring), box-shadow 0.25s ease, opacity 0.2s ease;
    }
    .accent-gradient-btn:hover {
      opacity: 0.96;
      box-shadow: 0 12px 28px -6px var(--accent-soft);
    }
    .accent-gradient-btn:active {
      transform: scale(0.985);
    }

    .accent-avatar {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-via), var(--accent-to));
      color: #ffffff !important;
    }

    .accent-pill {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
    }

    .accent-tag-active {
      background: linear-gradient(120deg, var(--accent-from), var(--accent-via)) !important;
      color: #ffffff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px var(--accent-soft);
    }

    .nav-active-pill {
      background: linear-gradient(135deg, var(--accent-from), var(--accent-via), var(--accent-to));
      opacity: 0.42;
    }
    html.light .nav-active-pill {
      opacity: 0.24;
    }

    /* ==================== ANIMATIONS & TEXT CONTRAST ==================== */
    @keyframes floatBlob1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(90px, 45px) scale(1.07); }
    }
    @keyframes floatBlob2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-75px, -55px) scale(1.09); }
    }
    @keyframes floatBlob3 {
      0%, 100% { transform: translate(-45px, -25px) scale(1); }
      50% { transform: translate(45px, 25px) scale(1.06); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.35; }
      50% { transform: translateY(-22px); opacity: 0.72; }
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.16) rotate(-4deg); }
    }
    @keyframes emojiFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.08); }
    }
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .blob-1 {
      background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%);
      animation: floatBlob1 20s ease-in-out infinite;
      transition: background 0.8s ease;
    }
    .blob-2 {
      background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%);
      animation: floatBlob2 25s ease-in-out infinite;
      transition: background 0.8s ease;
    }
    .blob-3 {
      background: radial-gradient(circle, var(--blob-3) 0%, transparent 70%);
      animation: floatBlob3 18s ease-in-out infinite;
      transition: background 0.8s ease;
    }

    .animate-enter {
      animation: cardEntrance 0.42s var(--card-spring) both;
    }
    .flame-animated {
      animation: flamePulse 2.4s ease-in-out infinite;
    }
    .mood-selected-emoji {
      animation: emojiFloat 2.2s ease-in-out infinite;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    /* High-contrast theme text utilities */
    .theme-text-primary { color: var(--text-primary); }
    .theme-text-secondary { color: var(--text-secondary); }
    .theme-text-muted { color: var(--text-tertiary); }

    .emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    @keyframes burstOut {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 0; }
    }
    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: burstOut 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body data-spot="accent">

  <!-- ==================== STUDIO CONTROL BAR ==================== -->
  <div class="sticky top-0 z-50 px-3 pt-2.5 pb-2.5 bg-slate-950/75 backdrop-blur-2xl border-b border-white/15 text-white">
    <div class="max-w-5xl mx-auto flex flex-col gap-2">
      <!-- Row 1: Locked Reference Badges & Switchers -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold accent-gradient-btn shadow">10.html</span>
          <span id="studio-title" class="text-xs font-semibold text-white/95">
            Vision Crystal + Thick Capsule + 8 Multi-Hue Coherent Dark &amp; Light Palettes
          </span>
        </div>

        <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
          <!-- Mood Button Style: 3D Keycaps / Glowing Orbs / Hybrid -->
          <select onchange="setMoodStyle(this.value)" id="sel-mood-style" class="px-2.5 py-1 rounded-xl bg-white/10 border border-white/20 text-white outline-none cursor-pointer">
            <option value="keycaps" class="bg-slate-900">Buttons: 3D Keycaps</option>
            <option value="orbs" class="bg-slate-900">Buttons: Glowing Orbs</option>
            <option value="hybrid" class="bg-slate-900">Buttons: Hybrid Orb-Keycaps</option>
          </select>

          <!-- Spotlight Feel Selector -->
          <select onchange="setSpotlightStyle(this.value)" id="sel-spot-style" class="px-2.5 py-1 rounded-xl bg-white/10 border border-white/20 text-white outline-none cursor-pointer">
            <option value="accent" class="bg-slate-900">Cursor Light: Accent Prism</option>
            <option value="classic" class="bg-slate-900">Cursor Light: Crystal Pearl</option>
            <option value="velvet" class="bg-slate-900">Cursor Light: Velvet Rim</option>
            <option value="halo" class="bg-slate-900">Cursor Light: Wide Satin Halo</option>
          </select>

          <!-- Mood-Reactive Blobs Toggle -->
          <button onclick="toggleMoodReactive()" id="btn-reactive" class="px-2.5 py-1 rounded-xl font-medium bg-emerald-500/25 border border-emerald-400/40 text-emerald-200 transition-all">
            Mood-Reactive: ON
          </button>

          <!-- Coherent Dark / Light Mode Toggle -->
          <button onclick="toggleThemeMode()" id="btn-mode" class="px-2.5 py-1 rounded-xl font-semibold bg-white/15 hover:bg-white/25 border border-white/20 text-white transition-all">
            🌙 Dark
          </button>

          <!-- RTL / LTR Toggle -->
          <button onclick="toggleLocale()" id="btn-lang" class="px-2.5 py-1 rounded-xl font-semibold bg-white/15 hover:bg-white/25 border border-white/20 text-white transition-all">
            عربي
          </button>

          <!-- Copy Choice -->
          <button onclick="copySelection()" id="btn-copy" class="px-3 py-1 rounded-xl font-bold accent-gradient-btn shadow">
            Copy Choice
          </button>
        </div>
      </div>

      <!-- Row 2: 8 Wide-Spectrum Multi-Hue Palettes -->
      <div id="palette-bar" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-1.5"></div>
    </div>
  </div>

  <!-- ==================== EXACT MOODFLOW ROOT ==================== -->
  <div class="min-h-screen relative overflow-hidden" id="moodflow-root">
    <!-- Floating Multi-Hue Gradient Mesh Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
      <div
        id="bg-mesh"
        class="absolute inset-0 transition-all duration-700"
        style="background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));"
      ></div>
      <div class="blob-1 absolute w-[760px] h-[760px] rounded-full" style="top: -18%; left: -8%;"></div>
      <div class="blob-2 absolute w-[620px] h-[620px] rounded-full" style="bottom: -12%; right: -6%;"></div>
      <div class="blob-3 absolute w-[520px] h-[520px] rounded-full" style="top: 42%; left: 42%;"></div>

      <!-- 5 Subtle Floating Particles -->
      <div class="absolute w-3.5 h-3.5 rounded-full bg-white/15 backdrop-blur-sm" style="top: 20%; left: 14%; animation: floatParticle 3.8s ease-in-out infinite;"></div>
      <div class="absolute w-3 h-3 rounded-full bg-white/15 backdrop-blur-sm" style="top: 38%; left: 78%; animation: floatParticle 4.6s ease-in-out infinite 0.5s;"></div>
      <div class="absolute w-4 h-4 rounded-full bg-white/10 backdrop-blur-sm" style="top: 58%; left: 22%; animation: floatParticle 5.4s ease-in-out infinite 1s;"></div>
      <div class="absolute w-3 h-3 rounded-full bg-white/15 backdrop-blur-sm" style="top: 72%; left: 68%; animation: floatParticle 6.2s ease-in-out infinite 1.5s;"></div>
    </div>

    <!-- Main Container -->
    <div id="page-container" class="relative z-10 max-w-4xl mx-auto px-4 py-7 md:px-6 md:py-9 pb-32"></div>

    <!-- Breathing Exercise Modal -->
    <div id="breathing-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-md"></div>

    <!-- Save Toast -->
    <div id="save-toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden px-6 py-3 backdrop-blur-xl bg-emerald-500/95 text-white rounded-full border border-white/25 shadow-2xl items-center gap-2">
      <span>✨</span>
      <span id="save-toast-text" class="font-medium text-sm">Mood entry saved!</span>
    </div>

    <!-- Floating Bottom Pill Navigation -->
    <nav class="fixed bottom-5 left-0 right-0 z-40 flex justify-center pointer-events-none px-2">
      <div class="pointer-events-auto max-w-[calc(100vw-1.5rem)]">
        <div class="glass rounded-full px-2.5 py-1.5 flex items-center gap-1 shadow-2xl">
          <div class="flex items-center" id="bottom-nav-items"></div>
          <div class="w-px h-6 bg-white/20 mx-1"></div>
          <button onclick="toggleLocale()" class="flex items-center gap-1 px-2.5 py-1.5 hover:bg-white/10 rounded-full transition-colors theme-text-primary text-xs font-semibold">
            <span>🌐</span>
            <span id="nav-lang-label">عربي</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <script>
    // Track cursor position inside each Vision Crystal card for interactive spotlight reflection
    window.addEventListener("mousemove", (e) => {
      document.querySelectorAll(".glass").forEach((card) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--mouse-x", `${e.clientX - rect.left}px`);
        card.style.setProperty("--mouse-y", `${e.clientY - rect.top}px`);
      });
    });

    // ==================== 8 WIDE-SPECTRUM MULTI-HUE COHERENT DARK & LIGHT PALETTES ====================
    const PALETTES = [
      {
        id: 1,
        nameEn: "1. Amethyst × Rose × Sky",
        nameAr: "١. بنفسجي × وردي × سماوي",
        descEn: "Multi-hue violet, rose silk & azure mist",
        descAr: "تدرج متكامل من البنفسجي والوردي والأزرق السماوي",
        swatch: "linear-gradient(135deg, #7c3aed, #ec4899, #38bdf8)",
        dark: {
          bgPrimary: "#0A0914",
          bgStart: "#3b0764", bgMid: "#1e1b4b", bgEnd: "#0c4a6e",
          blob1: "rgba(168, 85, 247, 0.42)", blob2: "rgba(236, 72, 153, 0.30)", blob3: "rgba(56, 189, 248, 0.28)",

    // Build smooth Bezier path so RTL reverses both curve AND data points identically to Recharts reversed={isRtl}
    function buildWeeklySvgChart(isAr) {
      const pts = WEEKLY_SERIES.map(p => ({
        x: isAr ? (600 - p.xBase) : p.xBase,
        y: p.y,
        label: isAr ? p.dAr : p.dEn,
        val: p.val,
        isLatest: p.dEn === "Fri"
      }));

      let lineD = `M ${pts[0].x},${pts[0].y}`;
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1];
        const curr = pts[i];
        const midX = (prev.x + curr.x) / 2;
        lineD += ` C ${midX},${prev.y} ${midX},${curr.y} ${curr.x},${curr.y}`;
      }
      const areaD = `${lineD} L ${pts[pts.length - 1].x},105 L ${pts[0].x},105 Z`;

      return `

    function selectPalette(id) {
      state.paletteId = id;
      renderAll();
    }

    function setMoodStyle(val) {
      state.moodStyle = val;
      renderAll();
    }

    function setSpotlightStyle(val) {
      state.spotStyle = val;
      renderAll();
    }

    function toggleMoodReactive() {
      state.moodReactive = !state.moodReactive;
      updateReactiveBtn();
      applyCSSVariables();
    }

    function updateReactiveBtn() {
      const btn = document.getElementById("btn-reactive");
      const isAr = state.locale === "ar";
      if (state.moodReactive) {
        btn.className = "px-2.5 py-1 rounded-xl font-medium bg-emerald-500/25 border border-emerald-400/40 text-emerald-200 transition-all";
        btn.textContent = isAr ? "تفاعل الخلفية: مفعل" : "Mood-Reactive: ON";
      } else {
        btn.className = "px-2.5 py-1 rounded-xl font-medium bg-white/10 border border-white/15 text-white/75 transition-all";
        btn.textContent = isAr ? "تفاعل الخلفية: متوقف" : "Mood-Reactive: OFF";
      }
    }

    function toggleThemeMode() {
      state.mode = state.mode === "dark" ? "light" : "dark";
      document.documentElement.classList.toggle("dark", state.mode === "dark");
      document.documentElement.classList.toggle("light", state.mode === "light");
      const isAr = state.locale === "ar";
      document.getElementById("btn-mode").textContent =
        state.mode === "dark" ? (isAr ? "🌙 داكن" : "🌙 Dark") : (isAr ? "☀️ نهاري" : "☀️ Light");
      renderAll();
    }

    function toggleLocale() {
      state.locale = state.locale === "en" ? "ar" : "en";
      const isAr = state.locale === "ar";
      document.documentElement.dir = isAr ? "rtl" : "ltr";
      document.documentElement.lang = state.locale;
      document.getElementById("btn-lang").textContent = isAr ? "EN" : "عربي";
      document.getElementById("btn-mode").textContent =
        state.mode === "dark" ? (isAr ? "🌙 داكن" : "🌙 Dark") : (isAr ? "☀️ نهاري" : "☀️ Light");
      document.getElementById("studio-title").textContent = isAr
        ? "رؤية الكريستال المضيء مع المنزلق الكبسولي و٨ ألوان متدرجة ومتناسقة"
        : "Vision Crystal + Thick Capsule + 8 Multi-Hue Coherent Dark & Light Palettes";
      updateReactiveBtn();
      renderAll();
    }

    function selectMood(idx) {
      state.selectedMood = idx;
      renderAll();
    }

    function updateIntensity(val) {
      state.intensity = parseInt(val, 10) || 50;
      const r = document.getElementById("intensity-readout");
      const f = document.getElementById("intensity-fill");
      if (r) r.textContent = state.intensity + "%";
      if (f) f.style.width = state.intensity + "%";
    }

    function toggleTag(tagEn) {
      if (state.selectedTags.includes(tagEn)) {
        state.selectedTags = state.selectedTags.filter(t => t !== tagEn);
      } else {
        state.selectedTags.push(tagEn);
      }
      renderAll();
    }

    function appendPrompt(text) {
      state.journalText = state.journalText ? state.journalText + "\n" + text + " " : text + " ";
      const box = document.getElementById("journal-box");
      if (box) {
        box.value = state.journalText;
        box.focus();
      }
    }

    function saveMoodEntry(e) {
      const m = MOODS[state.selectedMood ?? 0];
      if (e && e.clientX) {
        for (let i = 0; i < 10; i++) {
          const el = document.createElement("div");
          el.className = "burst-particle text-xl emoji";
          el.textContent = m.emoji;
          const angle = (Math.PI * 2 * i) / 10;
          const dist = 45 + Math.random() * 55;
          el.style.left = e.clientX + "px";
          el.style.top = e.clientY + "px";
          el.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--ty", Math.sin(angle) * dist - 25 + "px");
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 880);
        }
      }
      state.entries.unshift({
        id: String(Date.now()),
        mood: m.label,
        intensity: state.intensity,
        dateEn: state.selectedDay === "yesterday" ? "Yesterday" : "Today",
        dateAr: state.selectedDay === "yesterday" ? "أمس" : "اليوم",
        tags: [...state.selectedTags],
        textEn: state.journalText || "Checked in feeling " + m.label.toLowerCase() + ".",
        textAr: state.journalText || "تم تسجيل الحالة المزاجية بنجاح."
      });
      state.journalText = "";
      const toast = document.getElementById("save-toast");
      document.getElementById("save-toast-text").textContent =
        state.locale === "ar" ? "تم حفظ حالتك المزاجية بنجاح!" : "Mood entry saved!";
      toast.classList.remove("hidden");
      toast.classList.add("flex");
      setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("flex");
      }, 2100);
      renderAll();
    }

    function openBreathingModal() {
      const isAr = state.locale === "ar";
      const modal = document.getElementById("breathing-modal");
      modal.innerHTML = `
        <div class="glass-modal rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
          <div class="flex items-center justify-between mb-4">
            <span class="font-semibold text-sm theme-text-primary">🌬️ ${isAr ? "تمرين التنفس ٤-٧-٨" : "4-7-8 Mindful Breathing"}</span>
            <button onclick="closeBreathingModal()" class="p-1.5 rounded-full recessed-well text-xs theme-text-primary">✕</button>
          </div>
          <div class="my-8 flex items-center justify-center">
            <div class="w-40 h-40 rounded-full flex flex-col items-center justify-center border-2 border-white/40 shadow-2xl" style="background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%); animation: floatBlob1 6s ease-in-out infinite;">
              <span class="text-3xl font-bold theme-text-primary">4</span>
              <span class="text-xs uppercase tracking-widest opacity-80 mt-1 theme-text-primary">${isAr ? "شهيق هادئ" : "Inhale"}</span>
            </div>
          </div>
          <p class="text-xs theme-text-secondary">${isAr ? "استرخِ ودع التوتر يتلاشى" : "Relax your shoulders and breathe slowly"}</p>
        </div>
      `;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeBreathingModal() {
      const modal = document.getElementById("breathing-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function copySelection() {
      const pal = PALETTES.find(p => p.id === state.paletteId) || PALETTES[0];
      const text = `10.html Reference | Material: Vision Crystal (${state.spotStyle}) | Slider: Thick Capsule | Buttons: ${state.moodStyle} | Palette #${pal.id}: ${pal.nameEn}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      const btn = document.getElementById("btn-copy");
      btn.textContent = state.locale === "ar" ? "تم النسخ ✓" : "Copied ✓";
      setTimeout(() => {
        btn.textContent = state.locale === "ar" ? "نسخ الاختيار" : "Copy Choice";
      }, 1800);
    }

    function renderAll() {
      applyCSSVariables();
      renderPaletteBar();
      renderBottomNav();
      const container = document.getElementById("page-container");
      if (state.activeTab === "home") {
        container.innerHTML = renderTodayPage();
      } else if (state.activeTab === "history") {
        container.innerHTML = renderHistoryPage();
      } else {
        container.innerHTML = renderSettingsPage();
      }
    }

    renderAll();
  </script>
</body>
</html>
